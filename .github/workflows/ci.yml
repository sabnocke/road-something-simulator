name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-core:
    name: Build & Test Pure Simulation Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout
        with:
          lfs: true
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet
        with:
          dotnet-version: "8.0.x"
      
      - name: Restore Dependencies
        run: dotnet restore src/Traffic.Core.Tests/Traffic.Core.Tests.csproj

      - name: Run Headless Unit & Scenario Tests
        run: dotnet test src/Traffic.Core.Tests/Traffic.Core.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Verify Code Formatting
        run: dotnet format src/Traffic.Core/Traffic.Core.csproj --verify-no-changes
